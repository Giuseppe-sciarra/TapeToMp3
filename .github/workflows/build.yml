name: Build Tape2MP3

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (single-file, self-contained, win-x64)
        run: >
          dotnet publish src/Tape2MP3/Tape2MP3.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - name: Scarica ffmpeg (gyan.dev essentials)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffx
          $exe = Get-ChildItem ffx -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName publish\ffmpeg.exe
          Copy-Item README.md publish\LEGGIMI.txt

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath Tape2MP3-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Tape2MP3-win-x64
          path: publish/

      - name: Release (solo sui tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Tape2MP3-win-x64.zip
